# Example site for a server provisioned by `macvs deploy webroot`
# (printed by: macvs deploy webroot --example SITE_FQDN).
#
#   1. Put the site in /var/www/SITE_FQDN/htdocs (readable by www-data).
#   2. Save this file as /etc/apache2/sites-available/SITE_FQDN.conf.
#   3. Get a certificate inside the guest, e.g. with a DNS-01 plugin:
#        certbot certonly --dns-<provider> -d SITE_FQDN
#      (no inbound access is needed; renewals reload Apache through the macvs hook).
#      To serve plain HTTP first, delete the *:443 block and the RewriteRule below.
#   4. a2ensite SITE_FQDN && apache2ctl -t && systemctl reload apache2
#   5. On the Mac, point the name at the VM: echo '127.0.0.1 SITE_FQDN' | sudo tee -a /etc/hosts
#
# The default-deny vhost keeps answering 403 for every name this file does not claim.

<VirtualHost *:80>
    ServerName SITE_FQDN

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://SITE_FQDN%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/SITE_FQDN-redirect_error.log
    CustomLog ${APACHE_LOG_DIR}/SITE_FQDN-redirect_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName SITE_FQDN
    DocumentRoot /var/www/SITE_FQDN/htdocs
    DirectoryIndex index.php index.html
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/SITE_FQDN/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/SITE_FQDN/privkey.pem
    # For a domain on the HSTS preload list, or once you are sure HTTPS stays on:
    # Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    # Links are followed only to targets the same owner owns; .htaccess stays off
    # (set AllowOverride All here if a site really needs it).
    <Directory /var/www/SITE_FQDN/htdocs>
        Options SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
        # WordPress pretty permalinks without .htaccess; remove for a static site.
        FallbackResource /index.php
    </Directory>

    # PHP runs in PHP-FPM (pool "www"); one pool per site is possible later.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/phpPHP_VERSION-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/SITE_FQDN_error.log
    CustomLog ${APACHE_LOG_DIR}/SITE_FQDN_access.log combined
</VirtualHost>
